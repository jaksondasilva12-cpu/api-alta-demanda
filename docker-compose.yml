services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ingressos
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d ingressos"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://api_user:api_password@db:5432/ingressos
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-before-production-2026}
      TOKEN_MINUTES: 720
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
